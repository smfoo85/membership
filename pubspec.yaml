name: membership_wallet
description: "Offline-first membership card wallet."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Scan existing cards
  mobile_scanner: ^6.0.2

  # Render codes
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4

  # Biometric app lock
  local_auth: ^2.3.0

  # Local backup / export-import
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.1.6

  # Screen wake + brightness boost for checkout scanning
  wakelock_plus: ^1.2.10
  screen_brightness: ^1.0.1

  # Optional logo upload
  image_picker: ^1.1.2

  uuid: ^4.5.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 500
